name: Build & Sign Salatuk Hamza APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Install Apktool 2.10.0
        run: |
          sudo wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.10.0.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          apktool --version

      - name: 4. Build APK from apktool/ tree
        run: |
          apktool b apktool -o Salatuk-Hamza-unsigned.apk

      - name: 5. Align & Sign APK (v1 + v2 + v3)
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build-Tools: $BUILD_TOOLS_DIR"

          "$BUILD_TOOLS_DIR/zipalign" -p -f -v 4 Salatuk-Hamza-unsigned.apk Salatuk-Hamza-aligned.apk

          keytool -genkeypair -v \
            -keystore hamza-release.jks \
            -alias hamza \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass hamza123456 \
            -keypass hamza123456 \
            -dname "CN=Developer Hamza, OU=Mobile, O=Developer Hamza, L=Tanta, ST=Gharbia, C=EG"

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks hamza-release.jks \
            --ks-key-alias hamza \
            --ks-pass pass:hamza123456 \
            --key-pass pass:hamza123456 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Salatuk-3.7.73-Hamza-Signed.apk \
            Salatuk-Hamza-aligned.apk

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose Salatuk-3.7.73-Hamza-Signed.apk

      - name: 6. Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Salatuk-3.7.73-Hamza-Signed-APK
          path: Salatuk-3.7.73-Hamza-Signed.apk
          if-no-files-found: error

      - name: 7. Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.7.73-hamza-${{ github.run_number }}
          name: "Salatuk 3.7.73 Hamza (Build #${{ github.run_number }})"
          body: |
            ### نسخة تطبيق صلاتك المعدلة (Salatuk 3.7.73-hamza)
            - إصلاح مشكلة تعليق التطبيق (ANR) وقت الأذان والتنبيه عبر التشغيل المباشر لخدمة `AdhanService` وتحويل `commit()` إلى `apply()`.
            - تفعيل إيقاف الأذان بزر خفض/رفع الصوت افتراضياً وتصحيح `invoke-super` إلى `Le/j`.
            - إخفاء زر تسجيل الأذان في الواجهة العربية وتثبيت ظهور اسم `Developer Hamza / المطور حمزة`.
            - موقّع بالكامل (v1 + v2 + v3) وجاهز للتثبيت المباشر.
          files: Salatuk-3.7.73-Hamza-Signed.apk
